[package]
name = "pathie"
version = "0.3.0"
edition = "2021"
# version / authors / repository 會在編譯時讀進程式，顯示在「關於」頁
authors = ["YuCMochi"]
repository = "https://github.com/YuCMochi/Pathie"

# exe 名稱即產品名;開機自動啟動的 Run 值也用同一個名字
[[bin]]
name = "Pathie"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico"] }
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clipboard-win = "5"
winreg = "0.52"
sha2 = "0.10"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_Urlmon",
    "Win32_System_DataExchange",
    "Win32_System_Environment",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
